<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân | InvoicePilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="margin: 0; padding: 0; background-color: #060913; color: #fff; font-family: 'Inter', sans-serif;">

    <!-- Frame bố cục chính: Sidebar trái + Content phải -->
    <div class="app-layout" style="display: flex; min-height: 100vh;">
        
        <!-- SIDEBAR TRÁI (Đồng bộ chuẩn 100% với notifications.html) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class='bx bx-hexagon' style="color: var(--primary-color); font-size: 1.5rem;"></i> InvoicePilot
            </div>
            <div class="nav-group-title">Cá Nhân</div>
            <nav class="sidebar-nav">
                <!-- Các link điều hướng cá nhân -->
            </nav>

            <!-- Khung User Badge với nút Quay lại trang chủ-->
            <div style="margin-top: auto; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; height: 32px; background: var(--primary-color); color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;" id="avatarShort">NQ</div>
                    <div>
                        <div style="font-size: 0.85rem; font-weight: 600; color: #ffffff;" id="sidebarUserName">Nguyên Nhân Quân</div>
                        <div style="font-size: 0.75rem; color: var(--text-secondary);" id="sidebarUserRole">admin</div>
                    </div>
                </div>
                <a href="../Trangchu.html" title="Trở về Trang chủ" style="color: var(--primary-color); display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 6px; background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.2); text-decoration: none; transition: all 0.2s;">
                    <i class='bx bx-home-alt' style="font-size: 1.2rem;"></i>
                </a>
            </div>
        </aside>

        <!-- NỘI DUNG CHÍNH (Phía bên phải) -->
        <main class="main-content" style="flex: 1; padding: 36px 40px; overflow-y: auto;">
            
            <div style="font-size: 0.75rem; font-weight: 600; color: #64748b; letter-spacing: 0.08em; margin-bottom: 6px; text-transform: uppercase;">
                TÀI KHOẢN / THIẾT LẬP
            </div>
            <h1 style="font-size: 1.85rem; font-weight: 700; margin: 0 0 28px 0; color: #fff;">Hồ Sơ Cá Nhân</h1>

            <!-- Khung chứa 2 cột Form -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px; max-width: 1100px;">
                
                <!-- Cột 1: Thông tin cơ bản -->
                <div class="card" style="background: #0b0f19; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 28px;">
                    <h3 style="font-size: 1.05rem; font-weight: 600; color: #a855f7; margin: 0 0 22px 0; display: flex; align-items: center; gap: 8px;">
                        <i class='bx bx-id-card' style="font-size: 1.3rem;"></i> Thông Tin Cơ Bản
                    </h3>

                    <form id="profileInfoForm">
                        <div style="margin-bottom: 18px;">
                            <label style="display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px;">Họ và Tên</label>
                            <input type="text" class="btn-outline" style="width: 100%; padding: 11px 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; box-sizing: border-box;" placeholder="Nhập họ và tên...">
                        </div>

                        <div style="margin-bottom: 18px;">
                            <label style="display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px;">Tên đăng nhập</label>
                            <input type="text" class="btn-outline" style="width: 100%; padding: 11px 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; box-sizing: border-box;" placeholder="Nhập tên đăng nhập...">
                        </div>

                        <div style="margin-bottom: 18px;">
                            <label style="display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px;">Email liên hệ</label>
                            <input type="email" class="btn-outline" style="width: 100%; padding: 11px 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; box-sizing: border-box;" placeholder="nhanvien@invoicepilot.vn">
                        </div>

                        <div style="margin-bottom: 24px;">
                            <label style="display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px;">Vai trò hệ thống</label>
                            <input type="text" class="btn-outline" style="width: 100%; padding: 11px 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #818cf8; box-sizing: border-box;" value="Nhân viên kinh doanh" readonly>
                        </div>

                        <button type="submit" class="btn btn-primary" style="padding: 11px 22px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);">
                            <i class='bx bx-save'></i> Lưu Thay Đổi
                        </button>
                    </form>
                </div>

                <!-- Cột 2: Đổi mật khẩu -->
                <div class="card" style="background: #0b0f19; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 28px;">
                    <h3 style="font-size: 1.05rem; font-weight: 600; color: #f59e0b; margin: 0 0 22px 0; display: flex; align-items: center; gap: 8px;">
                        <i class='bx bx-lock-alt' style="font-size: 1.3rem;"></i> Đổi Mật Khẩu
                    </h3>

                    <form id="changePasswordForm">
                        <div style="margin-bottom: 18px;">
                            <label style="display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px;">Mật khẩu hiện tại</label>
                            <input type="password" class="btn-outline" style="width: 100%; padding: 11px 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; box-sizing: border-box;" placeholder="••••••••">
                        </div>

                        <div style="margin-bottom: 18px;">
                            <label style="display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px;">Mật khẩu mới</label>
                            <input type="password" class="btn-outline" style="width: 100%; padding: 11px 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; box-sizing: border-box;" placeholder="••••••••">
                        </div>

                        <div style="margin-bottom: 24px;">
                            <label style="display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px;">Xác nhận mật khẩu mới</label>
                            <input type="password" class="btn-outline" style="width: 100%; padding: 11px 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; box-sizing: border-box;" placeholder="••••••••">
                        </div>

                        <button type="submit" style="padding: 11px 22px; background: #f59e0b; color: #0b0f19; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">
                            <i class='bx bx-key'></i> Cập Nhật Mật Khẩu
                        </button>
                    </form>
                </div>

            </div>

        </main>
    </div>

    <!-- Scripts dùng chung -->
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
