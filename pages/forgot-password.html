<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu | InvoicePilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #060913;">
    <div class="card" style="width: 400px; padding: 32px; background: #0b0f19; border: 1px solid var(--border-color);">
        <div style="text-align: center; margin-bottom: 24px;">
            <i class='bx bx-hexagon' style="font-size: 3rem; color: var(--primary-color);"></i>
            <h2 style="margin: 10px 0 6px 0; font-size: 1.5rem;">Khôi Phục Mật Khẩu</h2>
            <p id="subTitle" style="font-size: 0.85rem; color: var(--text-secondary); margin: 0;">Nhập Email để nhận mã OTP xác thực</p>
        </div>

        <!-- Bước 1: Nhập Email -->
        <form id="stepEmailForm">
            <div style="margin-bottom: 16px;">
                <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Email tài khoản</label>
                <input type="email" id="resetEmail" class="btn-outline" style="width: 100%; padding: 10px 12px; border-radius: 8px; color: #fff;" placeholder="nhanvien@invoicepilot.vn" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px;">Gửi Mã Xác Thực OTP</button>
        </form>

        <!-- Bước 2: Nhập OTP & Mật khẩu mới (Ẩn ban đầu) -->
        <form id="stepOtpForm" style="display: none;">
            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Mã OTP (Đã gửi tới Thông báo)</label>
                <input type="text" id="otpCode" class="btn-outline" style="width: 100%; padding: 10px 12px; border-radius: 8px; color: #fff; letter-spacing: 4px; text-align: center; font-weight: bold;" placeholder="123456" maxlength="6" required>
            </div>
            <div style="margin-bottom: 16px;">
                <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Mật khẩu mới</label>
                <input type="password" id="resetNewPass" class="btn-outline" style="width: 100%; padding: 10px 12px; border-radius: 8px; color: #fff;" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px;">Đặt Lại Mật Khẩu</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="Dangnhap.html" style="color: var(--primary-color); text-decoration: none; font-size: 0.85rem;"><i class='bx bx-arrow-back'></i> Quay lại Đăng nhập</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stepEmailForm = document.getElementById('stepEmailForm');
            const stepOtpForm = document.getElementById('stepOtpForm');
            const resetEmail = document.getElementById('resetEmail');
            const otpCode = document.getElementById('otpCode');
            const subTitle = document.getElementById('subTitle');

            // 1. Tự chuyển sang Bước 2 nếu quay lại từ notifications.html
            const urlParams = new URLSearchParams(window.location.search);
            const step = urlParams.get('step');
            const activeOtpData = JSON.parse(localStorage.getItem('invoicepilot_reset_otp') || 'null');

            if (step === 'verify' && activeOtpData) {
                stepEmailForm.style.display = 'none';
                stepOtpForm.style.display = 'block';
                if (subTitle) subTitle.textContent = 'Nhập mã OTP xác thực và mật khẩu mới';
                if (urlParams.get('code')) {
                    otpCode.value = urlParams.get('code');
                }
            }

            // 2. Tạo mã OTP -> Lưu Thông báo -> Chuyển hướng sang notifications.html
            stepEmailForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = resetEmail.value.trim();
                const generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

                // Lưu bộ nhớ tạm OTP (Hạn dùng 5 phút)
                localStorage.setItem('invoicepilot_reset_otp', JSON.stringify({
                    email: email,
                    code: generatedOtp,
                    expiresAt: Date.now() + 5 * 60 * 1000
                }));

                // Đưa thông báo mới lên đầu danh sách
                let notifications = JSON.parse(localStorage.getItem('invoicepilot_notifications') || '[]');
                notifications.unshift({
                    id: 'notif_' + Date.now(),
                    title: 'Mã OTP khôi phục mật khẩu',
                    message: `Mã OTP xác thực tài khoản ${email} của bạn là: ${generatedOtp} (Hiệu lực 5 phút).`,
                    code: generatedOtp,
                    type: 'otp',
                    time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
                    isRead: false
                });
                localStorage.setItem('invoicepilot_notifications', JSON.stringify(notifications));

                // Chuyển hướng sang trang Thông báo
                window.location.href = 'notifications.html';
            });

            // 3. Xử lý Đổi Mật Khẩu
            stepOtpForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const inputOtp = otpCode.value.trim();
                const currentOtpSession = JSON.parse(localStorage.getItem('invoicepilot_reset_otp') || 'null');

                if (!currentOtpSession || Date.now() > currentOtpSession.expiresAt) {
                    alert('Mã OTP đã hết hạn hoặc không tồn tại! Vui lòng thử lại.');
                    localStorage.removeItem('invoicepilot_reset_otp');
                    window.location.href = 'forgot-password.html';
                    return;
                }

                if (inputOtp === currentOtpSession.code) {
                    alert('Đặt lại mật khẩu thành công! Bạn có thể đăng nhập ngay.');
                    localStorage.removeItem('invoicepilot_reset_otp');
                    window.location.href = 'Dangnhap.html';
                } else {
                    alert('Mã OTP không chính xác! Vui lòng kiểm tra lại trong Thông báo.');
                }
            });
        });
    </script>
    <!-- Script dùng chung cho mọi file trong thư mục pages/ -->
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
